env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

name: CI
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [serenity, main]
  pull_request:
    branches: [serenity, main]

jobs:
  lint-test-build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint all packages
        run: bun run lint

      - name: Run tests
        run: bun run test:core

      - name: Typecheck core
        run: bunx tsc --noEmit --project packages/core/tsconfig.json

      - name: Typecheck cli
        run: bunx tsc --noEmit --project packages/cli/tsconfig.json

      - name: Build web package
        run: bun run build
