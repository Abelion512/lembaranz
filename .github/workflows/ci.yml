env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test-build:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # One command, and the same command every phase gate names. It runs lint,
      # the design detector, a typecheck per package, all four test suites with
      # the coverage floors enforced, the render harness, and the dashboard
      # build. Adding a check here adds it to every gate at once.
      - name: Verify
        run: bun run verify
