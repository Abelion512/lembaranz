# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
#
# This workflow file requires a free account on Bearer.com to manage findings,
# notifications and more.
# See https://docs.bearer.com/guides/bearer-cloud/
name: Bearer Security Scan

on:
  push:
    branches: ["#33"]
  pull_request:
    branches: ["#33"]
  schedule:
    - cron: "29 7 * * 5"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  bearer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master

      - name: Run Bearer Security Report
        id: report
        uses: bearer/bearer-action@v1
        with:
          format: sarif
          output: results.sarif
          exit-code: 0

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
        continue-on-error: true
