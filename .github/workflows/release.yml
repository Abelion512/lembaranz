env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

name: rilis
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - "serenity"

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  rilis:
    name: Rilis Paket ke NPM
    runs-on: ubuntu-latest
    env:
      HAS_NPM: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Pasang Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Pasang Dependensi
        run: bun install --frozen-lockfile

      - name: Buat Pull Request Rilis atau Publish ke NPM
        if: env.HAS_NPM == 'true'
        id: changesets
        uses: changesets/action@v1
        with:
          # Pastikan skrip 'version-packages' dan 'ci:release' di root package.json
          version: bun run version-packages
          publish: bun run ci:release
          title: "🚀 Rilis Lembaranz v${{ github.ref_name }}"
          commit: "chore: rilis versi baru [skip ci]"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
