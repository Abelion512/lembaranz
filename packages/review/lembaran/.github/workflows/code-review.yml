name: Code Review

on:
  pull_request:
    branches: ["#33"]
    types: [opened, synchronize, reopened]

jobs:
  lint-and-validate:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ESLint
        run: bun run lint
        continue-on-error: false

      - name: Validate Build
        run: bun run build
        continue-on-error: false

      - name: Suggest Changes (Check Style)
        if: failure()
        run: echo "::warning title=Lint Failure::Pastikan kode Anda sudah rapi dan bebas dari error linting/build sebelum digabungkan ke 'main'."
