name: Publish CLI to NPM

on:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build packages
        run: bun run build

      - name: Publish @lembaran/cli
        run: bun publish --filter @lembaran/cli --access public
        env:
          NPM_CONFIG_OTP: ${{ secrets.NPM_OTP }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
