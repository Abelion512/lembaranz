services:
  lembaranz:
    build:
      context: .
      dockerfile: Dockerfile
    image: lembaranz:latest
    container_name: lembaranz
    # The image runs the interactive TUI, so keep stdin/tty attached:
    #   docker compose run --rm lembaranz
    stdin_open: true
    tty: true
    volumes:
      - lembaranz-data:/root/.lembaranz
    restart: "no"

volumes:
  lembaranz-data:
